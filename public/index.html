    </div>
    
    <div id="toast-notification" class="toast"></div>

    <div id="save-confirm-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center; backdrop-filter: blur(2px);">
        <div class="dialog-box-3d">
            <h3 style="margin-top:0; color:#03a9f4; font-size:16px; border-bottom:1px solid #3e3e42; padding-bottom:10px; display:flex; align-items:center; gap:8px;">
                <span style="font-size: 20px;">💾</span> Phần mềm soạn Toán - Lưu File
            </h3>
            <p id="save-confirm-msg" style="color:#fff; font-size:14px; margin:20px 0; line-height: 1.5;"></p>
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top: 25px;">
                <button onclick="cancelClose()" class="btn-dialog btn-dialog-cancel">Hủy</button>
                <button onclick="dontSaveAndClose()" class="btn-dialog btn-dialog-dontsave">Không lưu</button>
                <button onclick="confirmSaveAndClose()" class="btn-dialog btn-dialog-save">Lưu file</button>
            </div>
        </div>
    </div>

    <div id="custom-confirm-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center; backdrop-filter: blur(2px);">
        <div class="dialog-box-3d">
            <h3 style="margin-top:0; color:#03a9f4; font-size:16px; border-bottom:1px solid #3e3e42; padding-bottom:10px; display:flex; align-items:center; gap:8px;">
                <span style="font-size: 20px;">⚠️</span> Phần mềm soạn Toán - Thông báo
            </h3>
            <p id="custom-confirm-msg" style="color:#fff; font-size:14px; margin:20px 0; line-height: 1.5;"></p>
            <div style="display:flex; justify-content:flex-end; gap:12px; margin-top: 25px;">
                <button onclick="closeCustomConfirm(false)" class="btn-dialog btn-dialog-cancel">Hủy</button>
                <button onclick="closeCustomConfirm(true)" class="btn-dialog btn-dialog-confirm" style="background:#e53935;">Đồng ý</button>
            </div>
        </div>
    </div>

    <script src="online-shim.js"></script>
    <script src="app.js"></script>

</body>
</html>
